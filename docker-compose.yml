version: '3.8'

services:
  # 1. The Database (Message Queue)
  redis:
    image: redis:alpine
    # Ports hidden. Only internal Docker network can access.

  # 2. The Builder (Compiles and Uploads)
  build-server:
    build: ./build-server
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--dns-result-order=ipv4first
      
      # Mapping Oracle credentials to AWS variables to trick the SDK
      - AWS_ACCESS_KEY_ID=${ORC_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${ORC_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${ORC_BUCKET_NAME}
      - AWS_REGION=${ORC_REGION}
      - AWS_ENDPOINT_URL=${ORC_ENDPOINT_URL} # Tells the SDK to hit Oracle, not AWS
    depends_on:
      - redis

  # 3. The Router (Serves the deployed sites)
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mounts your routing rules into the Nginx container
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - build-server